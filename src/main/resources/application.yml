spring:
  application:
    name: ms-creditcard
  config:
    import: optional:configserver:http://localhost:8888
  data:
    mongodb:
      uri: mongodb://devuser:devpassword@localhost:27017/creditcard_db?authSource=admin
  kafka:
    consumer:
      group-id: ms-creditcard
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: java.util.Map

server:
  port: 8084

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
